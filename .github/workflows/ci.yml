name: Verify WindSight

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements-dev.lock
          npm ci --prefix frontend
      - name: Check Python source
        run: |
          ruff check backend index.py scripts
          ruff format --check backend index.py scripts
      - name: Backend regression tests
        working-directory: backend
        run: python -m pytest -q
      - name: Frontend regression tests and production build
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: Validate versioned snapshot offline
        run: PYTHONPATH=backend python -m scripts.validate_snapshot
      - name: Verify portable deployment independently of Docker
        run: python scripts/smoke.py --start-server
      - name: Build and start production containers
        env:
          WINDSIGHT_API_PORT: "18000"
          WINDSIGHT_WEB_PORT: "15173"
        run: docker compose -p windsight-ci -f docker-compose.yml up --build -d --wait --wait-timeout 120
      - name: Production HTTP smoke
        run: python scripts/smoke.py
      - name: Container diagnostics
        if: failure()
        run: docker compose -p windsight-ci -f docker-compose.yml logs --no-color --tail=100
      - name: Stop production test containers
        if: always()
        run: docker compose -p windsight-ci -f docker-compose.yml down
