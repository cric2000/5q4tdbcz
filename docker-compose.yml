services:
  backend:
    build: ./backend
    environment:
      WINDSIGHT_DECISION_CUTOFF_GMT: ${WINDSIGHT_DECISION_CUTOFF_GMT:-09:50}
      WINDSIGHT_CORS_ORIGINS: '${WINDSIGHT_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
